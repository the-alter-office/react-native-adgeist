name: Publish

on:
  push:
    branches: ["dev", "qa", "main"]
  workflow_dispatch:

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Determine environment based on branch
        id: environment
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            PUBLISH_ENV="prod"
            DIST_TAG="latest"
          elif [ "$BRANCH" = "qa" ]; then
            PUBLISH_ENV="qa"
            DIST_TAG="qa"
          elif [ "$BRANCH" = "dev" ]; then
            PUBLISH_ENV="beta"
            DIST_TAG="beta"
          else
            echo "::error::Publishing is only allowed from main, qa or dev (got '$BRANCH')"
            exit 1
          fi

          echo "publish_env=$PUBLISH_ENV" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing environment: $PUBLISH_ENV for branch: $BRANCH (dist-tag: $DIST_TAG)"

      - name: Configure build for environment
        env:
          PUBLISH_ENV: ${{ steps.environment.outputs.publish_env }}
        run: yarn configure-build "$PUBLISH_ENV" --publish

      - name: Add Android snapshot repository to README
        if: steps.environment.outputs.publish_env == 'beta'
        env:
          SNIPPET_PATH: ${{ runner.temp }}/android-snapshot-repository.md
          README_PATH: ${{ runner.temp }}/README.md
        run: |
          cat > "$SNIPPET_PATH" <<'EOF'
          > **Beta release:** this version uses a snapshot build of the native Android SDK. Add the Sonatype snapshot repository to your app's `android/build.gradle`, or the Android build cannot find `ai.adgeist:adgeistkit`:
          >
          > ```gradle
          > allprojects {
          >     repositories {
          >         maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
          >     }
          > }
          > ```
          EOF

          awk -v snippet="$SNIPPET_PATH" '
            { print }
            $0 == "### Android Configuration" {
              print ""
              while ((getline line < snippet) > 0) print line
              found = 1
            }
            END { if (!found) exit 1 }
          ' README.md > "$README_PATH" || {
            echo "::error::'### Android Configuration' heading not found in README.md"
            exit 1
          }

          mv "$README_PATH" README.md
          echo "Added the Android snapshot repository instructions to README.md"

      - name: Use stable AdgeistKit releases
        if: >-
          steps.environment.outputs.publish_env == 'prod' ||
          steps.environment.outputs.publish_env == 'qa'
        run: |
          for PLATFORM in ios android; do
            VERSION="$(
              node -p "require('./package.json').adgeistKit.${PLATFORM}.version"
            )"
            STABLE="${VERSION%%-*}"

            echo "Switching AdgeistKit $PLATFORM $VERSION -> $STABLE"
            yarn update-adgeistkit "$PLATFORM" "$STABLE"
          done

      - name: Build package
        run: yarn prepare

      - name: Check for duplicate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if ! npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version is available: $PACKAGE_NAME@$PACKAGE_VERSION"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            echo "::notice::$PACKAGE_NAME@$PACKAGE_VERSION is already published. Skipping publish."
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION is already published. Bump PACKAGE_VERSION in src/constants.ts."
          exit 1

      - name: Upgrade npm for trusted publishing
        if: steps.version.outputs.skip_publish != 'true'
        run: npm install -g npm@11

      - name: Publish to npm
        if: steps.version.outputs.skip_publish != 'true'
        env:
          DIST_TAG: ${{ steps.environment.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG"

      - name: Send Slack notification
        if: always() && steps.version.outputs.skip_publish != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUBLISH_ENV: ${{ steps.environment.outputs.publish_env }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: https://www.npmjs.com/package/@thealteroffice/react-native-adgeist
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Deployment Succeeded"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Deployment Failed"
          fi

          MESSAGE="$(cat <<EOF
          *React Native Package Deployment Status*

          $STATUS_EMOJI *Status:* $STATUS_TEXT
          *Repository:* $REPOSITORY
          *Branch:* $BRANCH
          *Environment:* ${PUBLISH_ENV:-unknown}
          *Version:* ${PACKAGE_VERSION:-unknown}
          EOF
          )"

          PAYLOAD="$(
            jq -n \
              --arg text "$MESSAGE" \
              --arg workflowUrl "$WORKFLOW_URL" \
              --arg artifactUrl "$ARTIFACT_URL" \
              '{
                text: $text,
                workflowUrl: $workflowUrl,
                artifactUrl: $artifactUrl
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
