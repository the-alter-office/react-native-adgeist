name: E2E Android

on:
  push:
    branches: [e2e/matrix]
  workflow_dispatch:
    inputs:
      sdk_version:
        description: SDK version or dist-tag to test. Empty uses the E2E_SDK_VERSION repository variable.
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e-android:
    name: E2E Android matrix
    runs-on: ubuntu-latest
    timeout-minutes: 135
    defaults:
      run:
        working-directory: e2e
    env:
      SDK_VERSION: ${{ inputs.sdk_version || vars.E2E_SDK_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record start time
        run: echo "E2E_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the SDK version
        run: |
          if [ -z "$SDK_VERSION" ]; then
            echo "::error::Set the E2E_SDK_VERSION repository variable, or enter sdk_version when running the workflow."
            exit 1
          fi
          echo "Testing @thealteroffice/react-native-adgeist@$SDK_VERSION"

      - name: Write .env
        env:
          ADGEIST_E2E_APP_ID: ${{ vars.ADGEIST_E2E_APP_ID }}
          ADGEIST_E2E_PACKAGE_NAME: ${{ vars.ADGEIST_E2E_PACKAGE_NAME }}
          ADGEIST_E2E_AD1_UNIT_ID: ${{ vars.ADGEIST_E2E_AD1_UNIT_ID }}
          ADGEIST_E2E_AD1_RESPONSIVE: ${{ vars.ADGEIST_E2E_AD1_RESPONSIVE }}
          ADGEIST_E2E_AD1_WIDTH: ${{ vars.ADGEIST_E2E_AD1_WIDTH }}
          ADGEIST_E2E_AD1_HEIGHT: ${{ vars.ADGEIST_E2E_AD1_HEIGHT }}
          ADGEIST_E2E_AD2_UNIT_ID: ${{ vars.ADGEIST_E2E_AD2_UNIT_ID }}
          ADGEIST_E2E_AD2_RESPONSIVE: ${{ vars.ADGEIST_E2E_AD2_RESPONSIVE }}
          ADGEIST_E2E_AD2_WIDTH: ${{ vars.ADGEIST_E2E_AD2_WIDTH }}
          ADGEIST_E2E_AD2_HEIGHT: ${{ vars.ADGEIST_E2E_AD2_HEIGHT }}
          ADGEIST_E2E_AD3_UNIT_ID: ${{ vars.ADGEIST_E2E_AD3_UNIT_ID }}
          ADGEIST_E2E_AD3_RESPONSIVE: ${{ vars.ADGEIST_E2E_AD3_RESPONSIVE }}
          ADGEIST_E2E_AD3_WIDTH: ${{ vars.ADGEIST_E2E_AD3_WIDTH }}
          ADGEIST_E2E_AD3_HEIGHT: ${{ vars.ADGEIST_E2E_AD3_HEIGHT }}
        run: |
          env | grep '^ADGEIST_E2E_' > .env

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run and test every app
        timeout-minutes: 120
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: e2e
          script: ./scripts/ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results/
          if-no-files-found: ignore

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AUTOMATION_TEST_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Passed"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Failed"
          fi

          SDK_PACKAGE="@thealteroffice/react-native-adgeist"
          SDK_EXACT="$(npm view "$SDK_PACKAGE@$SDK_VERSION" version 2>/dev/null | tail -n 1)"
          SDK_EXACT="${SDK_EXACT:-${SDK_VERSION:-unknown}}"
          SDK_LINK="https://www.npmjs.com/package/$SDK_PACKAGE/v/$SDK_EXACT"

          DURATION="$(( ($(date +%s) - ${E2E_STARTED_AT:-$(date +%s)}) / 60 ))"
          if [ -f results/summary.json ]; then
            SUMMARY="$(jq -r '"\(.passed) passed, \(.failed) failed (\(.total) React Native versions)"' results/summary.json) in $DURATION min"
            FAILURES="$(jq -r '.failures[] | "• \(.line) · \(.check): \(.detail)"' results/summary.json)"
          else
            SUMMARY="No results: the run stopped before the apps were tested ($DURATION min)"
            FAILURES=""
          fi

          FAILED_SECTION=""
          if [ -n "$FAILURES" ]; then
            FAILED_SECTION=$'\n*Failed versions:*\n'"$FAILURES"$'\n'
          fi

          MESSAGE="$(cat <<EOF
          *React Native SDK E2E Tests (Android)*
          The SDK was installed into an app for each supported React Native version, built, launched on an emulator and tested with Maestro.

          $STATUS_EMOJI *Status:* $STATUS_TEXT
          *Summary:* $SUMMARY

          *SDK:* $SDK_LINK
          *Repository:* $REPOSITORY
          *Branch:* $BRANCH
          ${FAILED_SECTION}
          👇 Open the run summary to see the checks, Maestro reports and screenshots for every React Native version.
          EOF
          )"

          PAYLOAD="$(
            jq -n \
              --arg text "$MESSAGE" \
              --arg reportUrl "$SUMMARY_URL" \
              '{
                text: $text,
                reportUrl: $reportUrl
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
