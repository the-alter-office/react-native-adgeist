appId: ${APP_ID}
name: DISPLAY-01 Display ad lifecycle
tags:
  - android
  - display
  - lifecycle
env:
  TEST_ID: DISPLAY-01
  KIND: display
onFlowComplete:
  - runFlow: ../../subflows/capture_evidence.yaml
---
- runFlow:
    file: ../../subflows/open_ad_screen.yaml
    label: 'Step 1: open the display ad screen from Home'
- runFlow:
    file: ../../subflows/assert_ad_rendered.yaml
    label: 'Verify: AL1 (AD_LOADED) received and the display ad is on screen'
- runFlow:
    file: ../../subflows/tap_ad.yaml
    label: 'Step 2: tap the display ad'
- runFlow:
    file: ../../subflows/return_to_ad_screen.yaml
    label: 'Step 3: return to the display ad screen if the tap opened a browser'
- runFlow:
    file: ../../subflows/assert_click_handled.yaml
    label: 'Verify: AI1 (AD_CLICKED) received'
- runFlow:
    file: ../../subflows/assert_no_unexpected_events.yaml
    label: 'Verify: no unexpected AE / AW / RWAE1 events'
